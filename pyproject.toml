[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-tracking-c"
version = "0.1.0"
description = "Replication of Singh et al. W16-4123 (Dundee reading times + readability, System 1/2)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0,<3",
  "pandas>=2.0.0,<3",
  "scikit-learn>=1.3.0,<2",
  "PyYAML>=6.0,<7",
  "joblib>=1.3.0,<2",
  "nltk>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
